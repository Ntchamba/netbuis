name: netbuis
description: NetBuis — trouver un produit chez les commerçants locaux et les appeler directement.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  sms_autofill: ^2.6.1
  intl: ^0.20.3
  # Recherche vocale
  speech_to_text: ^7.5.0
  # Lecture à voix haute (synthèse vocale du téléphone)
  flutter_tts: ^4.2.5
  # Cartes (optionnel)
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Impression (optionnel)
  pdf: ^3.13.1
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  # Notifications (É8)
  # firebase_core: any
  # firebase_messaging: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/l10n/
