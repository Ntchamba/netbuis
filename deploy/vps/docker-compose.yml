# NetBuis en production sur un VPS (Contabo ou autre) : Caddy (HTTPS automatique) + base + serveur
# + tableau de bord + application web (PWA). Lancé par deploy/vps/install.sh ; voir docs/deployment/VPS_CONTABO.md.
# Les secrets viennent du fichier deploy/vps/.env (créé par install.sh, droits 600, jamais versionné).
name: netbuis

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE: ${DOMAINE}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, edge]
    depends_on: [api, dashboard, pwa]

  # Serveur TURN/STUN pour les appels WebRTC directs (D-31). Réseau « host » : il écoute sur les ports 3478
  # (UDP et TCP) et relaie le son sur la plage UDP 49152-49999. Les identifiants sont temporaires
  # (secret partagé avec le serveur NetBuis, mode use-auth-secret). Les adresses privées sont refusées
  # comme destinations (sinon coturn pourrait servir de rebond vers le réseau interne du VPS).
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--realm=${DOMAINE}"
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=49999"
      - "--no-tls"
      - "--no-multicast-peers"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbuis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: netbuis
    volumes:
      - netbuis_pg:/var/lib/postgresql/data
      - ../../backend/scripts/create_extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbuis"]
      interval: 5s
      retries: 20
    # Aucun port publié : la base n'est joignable que par les autres conteneurs.

  api: &api
    build: ../../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://netbuis:${POSTGRES_PASSWORD}@db:5432/netbuis
      ALLOWED_HOSTS: api.${DOMAINE}
      CORS_ALLOWED_ORIGINS: https://admin.${DOMAINE},https://app.${DOMAINE}
      CSRF_TRUSTED_ORIGINS: https://admin.${DOMAINE},https://app.${DOMAINE}
      NUM_PROXIES: "1"
      WEB_CONCURRENCY: "2"
      SMS_PROVIDER: ${SMS_PROVIDER:-real}
      SMS_API_KEY: ${SMS_API_KEY:-}
      CALL_ENGINE: ${CALL_ENGINE:-jitsi}
      STUN_URLS: stun:${DOMAINE}:3478
      TURN_URLS: turn:${DOMAINE}:3478?transport=udp,turn:${DOMAINE}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-}
      JITSI_APP_ID: ${JITSI_APP_ID:-}
      JITSI_JWT_SECRET: ${JITSI_JWT_SECRET:-}
      MEDIA_ROOT: /data/media
      PRIVATE_MEDIA_ROOT: /data/private_media
    volumes:
      - netbuis_data:/data

  expire_calls:
    <<: *api
    # Attend que le serveur ait appliqué les migrations, puis ferme les sonneries oubliées toutes les 30 s.
    command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'expire_calls : migrations pas encore appliquées, nouvel essai dans 5 s'; sleep 5; done; exec python manage.py expire_calls --loop 30"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  dashboard:
    build:
      context: ../../dashboard
      args:
        VITE_API_BASE_URL: https://api.${DOMAINE}
    restart: unless-stopped
    environment:
      PORT: "8080"

  pwa:
    build:
      context: ../../mobile
      args:
        API_URL: https://api.${DOMAINE}/api
    restart: unless-stopped
    environment:
      PORT: "8080"

volumes:
  netbuis_pg:
  netbuis_data:
  caddy_data:
  caddy_config:

networks:
  # Réseau partagé avec Jitsi (jitsi.sh) pour que Caddy joigne le site de visio sans publier de port.
  edge:
    name: netbuis_edge
    external: true
