name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      distribuer:
        description: "Envoyer l'APK aux testeurs par Firebase App Distribution"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Serveur (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbuis_ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: netbuis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbuis_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://netbuis_ci:ci-local-only@localhost:5432/netbuis
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret-32-octets-minimum
      SMS_PROVIDER: console
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q -p no:warnings -o addopts=""
      - name: Le contrat d'API publié est à jour
        run: |
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
          cmp /tmp/openapi.yaml ../docs/api/openapi.yaml

  dashboard:
    name: Tableau de bord (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  mobile:
    name: Application mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=USE_FAKE_API=true

  pwa-web:
    name: PWA (web)
    runs-on: ubuntu-latest
    needs: [mobile]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Construire la PWA (adresse d'API factice en https, la vraie est donnee a la construction Railway)
        run: flutter build web --release --no-web-resources-cdn --dart-define=API_URL=https://exemple.invalide/api
      - name: Poids du site
        run: du -sh build/web
      - uses: actions/upload-artifact@v4
        with:
          name: netbuis-pwa-web
          path: mobile/build/web
          retention-days: 14

  appel-de-bout-en-bout:
    name: Appel de bout en bout (serveur réel + navigateur)
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbuis_ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: netbuis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbuis_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://netbuis_ci:ci-local-only@localhost:5432/netbuis
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret-32-octets-minimum
      SMS_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: pip install -r backend/requirements/dev.txt
      - run: python manage.py migrate
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: dashboard
      - name: Navigateur (Chromium via Playwright)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Appel de bout en bout et mesure de latence
        env:
          PYTHON: python
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright"
          node scripts/e2e_appel/bout_en_bout.mjs

  apk:
    name: APK Android (signature de débogage)
    runs-on: ubuntu-latest
    needs: [mobile]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Construire l'APK (adresse du serveur fournie par un secret de dépôt)
        env:
          API_URL: ${{ secrets.NETBUIS_API_URL }}
        run: flutter build apk --release --dart-define=API_URL="${API_URL:-https://exemple.invalide/api}"
      - name: Taille de l'APK
        run: ls -l build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: netbuis-apk-debug-signe
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Envoi aux testeurs (Firebase App Distribution)
        if: github.event_name == 'workflow_dispatch' && inputs.distribuer
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
        run: |
          # Le fichier de clé n'existe que le temps de l'étape et n'est jamais affiché.
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" --groups "${FIREBASE_TESTER_GROUP:-testeurs}" \
            --release-notes "Version de test ${GITHUB_SHA::7}"
          rm -f "$RUNNER_TEMP/firebase-sa.json"
