<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NetBuis — Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
input::placeholder{color:inherit;opacity:0.55}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{bg}};color:{{textPrimary}};display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative">

  <div style="padding:20px 20px 0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <sc-if value="{{isOtpStep}}" hint-placeholder-val="{{false}}">
    <button onClick="{{backToPhone}}" aria-label="Retour" style="width:36px;height:36px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2.2"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    </sc-if>
    <sc-if value="{{isPhoneStep}}" hint-placeholder-val="{{true}}">
    <div style="width:36px;height:36px"></div>
    </sc-if>
    <button onClick="{{toggleTheme}}" aria-label="Changer de thème" style="width:36px;height:36px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>
      </sc-if>
    </button>
  </div>

  <div style="flex:1;padding:28px 24px 24px 24px;display:flex;flex-direction:column">

    <sc-if value="{{isPhoneStep}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;flex-direction:column;gap:22px">
      <div>
        <div style="font-size:23px;font-weight:800">Connexion</div>
        <div style="font-size:13.5px;color:{{textSecondary}};margin-top:8px;line-height:1.5">Entrez votre numéro de téléphone pour continuer. Un code de vérification vous sera envoyé par SMS.</div>
      </div>
      <div style="display:flex;gap:8px">
        <div style="background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:14px 12px;font-size:14px;font-weight:600;color:{{textPrimary}}">🇨🇲 +237</div>
        <input type="tel" inputmode="numeric" placeholder="6XX XX XX XX" aria-label="Numéro de téléphone" style="flex:1;background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:14px;font-size:15px;color:{{textPrimary}};box-sizing:border-box" />
      </div>
      <button onClick="{{goToOtp}}" style="width:100%;box-sizing:border-box;background:{{accent}};border:none;color:#1A1200;font-size:15px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer">Recevoir le code</button>
      <div style="font-size:11.5px;color:{{textTertiary}};line-height:1.5;text-align:center">En continuant, vous acceptez les conditions d'utilisation et la politique de confidentialité de NetBuis.</div>
    </div>
    </sc-if>

    <sc-if value="{{isOtpStep}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;flex-direction:column;gap:22px">
      <div>
        <div style="font-size:23px;font-weight:800">Vérification</div>
        <div style="font-size:13.5px;color:{{textSecondary}};margin-top:8px;line-height:1.5">Code envoyé au +237 6•• •• •• 12.</div>
      </div>
      <input type="text" inputmode="numeric" maxlength="6" placeholder="• • • • • •" aria-label="Code de vérification" style="width:100%;box-sizing:border-box;background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:16px;font-size:22px;letter-spacing:10px;text-align:center;color:{{textPrimary}}" />
      <a href="Onboarding.dc.html" style="width:100%;box-sizing:border-box;background:{{accent}};color:#1A1200;font-size:15px;font-weight:700;padding:15px;border-radius:14px;text-align:center">Vérifier</a>
      <a href="#" style="font-size:13px;font-weight:600;color:{{accent}};text-align:center">Renvoyer le code</a>
    </div>
    </sc-if>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2942E"},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: (props && props.theme) || 'dark', step: 'phone' };
    this.toggleTheme = this.toggleTheme.bind(this);
    this.goToOtp = this.goToOtp.bind(this);
    this.backToPhone = this.backToPhone.bind(this);
  }
  toggleTheme() {
    this.setState({ theme: this.state.theme === 'dark' ? 'light' : 'dark' });
  }
  goToOtp() {
    this.setState({ step: 'otp' });
  }
  backToPhone() {
    this.setState({ step: 'phone' });
  }
  renderVals() {
    const isDark = (this.state.theme || this.props.theme || 'dark') === 'dark';
    const dark = { bg: '#0D0D0F', cardBg: '#1B1B1E', cardBorder: '#2A2A2E', textPrimary: '#FFFFFF', textSecondary: '#9A9A9E', textTertiary: '#7A7A7E' };
    const light = { bg: '#F7F7F8', cardBg: '#FFFFFF', cardBorder: '#E3E3E7', textPrimary: '#18181B', textSecondary: '#63636A', textTertiary: '#8E8E93' };
    const c = isDark ? dark : light;
    return {
      accent: this.props.accent ?? '#F2942E',
      isDark: isDark,
      isLight: !isDark,
      toggleTheme: this.toggleTheme,
      goToOtp: this.goToOtp,
      backToPhone: this.backToPhone,
      isPhoneStep: this.state.step === 'phone',
      isOtpStep: this.state.step === 'otp',
      bg: c.bg, cardBg: c.cardBg, cardBorder: c.cardBorder, textPrimary: c.textPrimary, textSecondary: c.textSecondary, textTertiary: c.textTertiary
    };
  }
}
</script>
</body>
</html>
