<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NetBuis — Historique des appels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{bg}};color:{{textPrimary}};display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative">

  <div style="padding:20px 20px 12px 20px;flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <a href="Profil.dc.html" style="display:inline-flex;align-items:center;gap:6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="2.2"><path d="M15 18l-6-6 6-6"></path></svg>
        <span style="font-size:13px;color:{{textSecondary}}">Profil</span>
      </a>
      <button onClick="{{toggleTheme}}" aria-label="Changer de thème" style="width:32px;height:32px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>
        </sc-if>
      </button>
    </div>
    <div style="font-size:20px;font-weight:800">Historique de mes appels</div>
    <div style="font-size:13px;color:{{textSecondary}};margin-top:2px">Les commerçants et particuliers que vous avez appelés via NetBuis</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{calls}}" as="c" hint-placeholder-count="4">
    <div style="background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="width:38px;height:38px;border-radius:50%;background:{{iconBg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.4a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"></path></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700">{{c.business}}</div>
        <div style="font-size:12px;color:{{textSecondary}};margin-top:1px">{{c.zone}} · {{c.date}}</div>
      </div>
      <div style="background:{{c.badgeBg}};color:{{c.badgeColor}};font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap">{{c.badge}}</div>
    </div>
    </sc-for>
  </div>

  <div style="flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:12px 0 22px 0;background:{{navBg}};border-top:1px solid {{cardBorder}}">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Accueil</span>
    </a>
    <a href="Carte.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M9 20l-6 2V6l6-2 6 2 6-2v16l-6 2-6-2z"></path><path d="M9 4v16M15 6v16"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Carte</span>
    </a>
    <a href="Forum.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Forum</span>
    </a>
    <a href="Profil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-7 8-7s8 3 8 7"></path></svg>
      <span style="font-size:10px;color:{{accent}};font-weight:700">Profil</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2942E"},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: (props && props.theme) || 'dark' };
    this.toggleTheme = this.toggleTheme.bind(this);
  }
  toggleTheme() {
    this.setState({ theme: this.state.theme === 'dark' ? 'light' : 'dark' });
  }
  renderVals() {
    const isDark = (this.state.theme || this.props.theme || 'dark') === 'dark';
    const dark = { bg: '#0D0D0F', cardBg: '#1B1B1E', cardBorder: '#2A2A2E', textPrimary: '#FFFFFF', textSecondary: '#9A9A9E', textTertiary: '#7A7A7E', navBg: '#121214', iconBg: '#262620', successBg: '#1E2E22', successText: '#5FBE7A', packBg: '#262620' };
    const light = { bg: '#F7F7F8', cardBg: '#FFFFFF', cardBorder: '#E3E3E7', textPrimary: '#18181B', textSecondary: '#63636A', textTertiary: '#8E8E93', navBg: '#FFFFFF', iconBg: '#FBE7C8', successBg: '#E3F5E7', successText: '#1E8A3C', packBg: '#FBE7C8' };
    const c = isDark ? dark : light;
    const accent = this.props.accent ?? '#F2942E';
    return {
      accent: accent,
      isDark: isDark,
      isLight: !isDark,
      toggleTheme: this.toggleTheme,
      bg: c.bg, cardBg: c.cardBg, cardBorder: c.cardBorder, textPrimary: c.textPrimary, textSecondary: c.textSecondary, textTertiary: c.textTertiary, navBg: c.navBg, iconBg: c.iconBg,
      calls: [
        { business: 'Électricien qualifié', zone: 'Hardé', date: 'Aujourd’hui, 09:14', badge: 'Gratuit', badgeBg: c.successBg, badgeColor: c.successText },
        { business: 'Boutique Mama Aïcha', zone: 'Dougoï', date: 'Hier, 17:40', badge: 'Pack', badgeBg: c.packBg, badgeColor: accent },
        { business: 'Couturier Ibrahim', zone: 'Domayo', date: '28 sept., 11:02', badge: 'Pack', badgeBg: c.packBg, badgeColor: accent },
        { business: 'Quincaillerie Hardé', zone: 'Hardé', date: '26 sept., 08:50', badge: 'Pack', badgeBg: c.packBg, badgeColor: accent }
      ]
    };
  }
}
</script>
</body>
</html>
