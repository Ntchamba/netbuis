<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NetBuis — Publication</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{bg}};color:{{textPrimary}};display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative">

  <div style="padding:20px 20px 14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid {{cardBorder}}">
    <a href="Forum.dc.html" style="display:inline-flex;align-items:center;gap:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="2.2"><path d="M15 18l-6-6 6-6"></path></svg>
      <span style="font-size:13px;color:{{textSecondary}}">Forum</span>
    </a>
    <button onClick="{{toggleTheme}}" aria-label="Changer de thème" style="width:32px;height:32px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>
      </sc-if>
    </button>
  </div>

  <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">

    <div style="display:flex;align-items:center;gap:10px;padding:14px 20px">
      <div style="width:34px;height:34px;border-radius:50%;background:{{accent}};color:#1A1200;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">MA</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700">Boutique Mama Aïcha</div>
        <div style="font-size:11px;color:{{textSecondary}}">Dougoï · 2h</div>
      </div>
    </div>

    <div style="width:100%;height:200px;background:{{mediaBg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{iconMuted}}" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 15l5-5 4 4 5-6 4 5"></path><circle cx="8" cy="8.5" r="1.4"></circle></svg>
    </div>

    <div style="padding:14px 20px 10px 20px">
      <div style="font-size:14px;line-height:1.5;color:{{textPrimary}}">Nouveau lot de riz parfumé disponible — 25kg et 50kg, prix de gros.</div>
      <div style="margin-top:10px;display:inline-block;background:{{tagBg}};border:1px solid {{tagBorder}};color:{{tagText}};font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px">Riz 25kg</div>
    </div>

    <div style="padding:16px 20px 8px 20px;font-size:13px;font-weight:700;color:{{textSecondary}}">Commentaires · {{commentCount}}</div>

    <div style="padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{comments}}" as="cm" hint-placeholder-count="3">
      <div style="display:flex;gap:10px">
        <div style="width:30px;height:30px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};color:{{textSecondary}};font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{cm.initials}}</div>
        <div style="flex:1;min-width:0">
          <div style="background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:10px 12px">
            <div style="font-size:12px;font-weight:700">{{cm.name}}</div>
            <div style="font-size:13px;color:{{textPrimary}};margin-top:2px;line-height:1.4">{{cm.text}}</div>
          </div>
          <div style="font-size:11px;color:{{textTertiary}};margin-top:4px;margin-left:4px">{{cm.time}}</div>
        </div>
      </div>
      </sc-for>
    </div>

  </div>

  <div style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 20px 22px 20px;background:{{navBg}};border-top:1px solid {{cardBorder}}">
    <input type="text" placeholder="Écrire un commentaire..." style="flex:1;background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:999px;padding:11px 16px;color:{{textPrimary}};font-size:14px;box-sizing:border-box">
    <button aria-label="Envoyer" style="width:40px;height:40px;border-radius:50%;background:{{accent}};border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2942E"},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: (props && props.theme) || 'dark' };
    this.toggleTheme = this.toggleTheme.bind(this);
  }
  toggleTheme() {
    this.setState({ theme: this.state.theme === 'dark' ? 'light' : 'dark' });
  }
  renderVals() {
    const isDark = (this.state.theme || this.props.theme || 'dark') === 'dark';
    const dark = { bg: '#0D0D0F', cardBg: '#1B1B1E', cardBorder: '#2A2A2E', textPrimary: '#FFFFFF', textSecondary: '#9A9A9E', textTertiary: '#7A7A7E', navBg: '#121214', mediaBg: '#15151A', iconMuted: '#3A3A40', tagBg: '#262620', tagBorder: '#3A3A2E', tagText: '#F2942E' };
    const light = { bg: '#F7F7F8', cardBg: '#FFFFFF', cardBorder: '#E3E3E7', textPrimary: '#18181B', textSecondary: '#63636A', textTertiary: '#8E8E93', navBg: '#FFFFFF', mediaBg: '#EFEFF2', iconMuted: '#C8C8CE', tagBg: '#FBE7C8', tagBorder: '#F0D6A3', tagText: '#A6650A' };
    const c = isDark ? dark : light;
    const comments = [
      { initials: 'JN', name: 'Jeff N.', text: 'Le riz 25kg est encore disponible cette semaine ?', time: 'Il y a 1h' },
      { initials: 'SA', name: 'Sali A.', text: 'Vous livrez aussi vers Djarengol ?', time: 'Il y a 45 min' },
      { initials: 'MA', name: 'Boutique Mama Aïcha', text: 'Oui, livraison possible dans tout Maroua, contactez-nous par appel.', time: 'Il y a 30 min' }
    ];
    return {
      accent: this.props.accent ?? '#F2942E',
      isDark: isDark,
      isLight: !isDark,
      toggleTheme: this.toggleTheme,
      bg: c.bg, cardBg: c.cardBg, cardBorder: c.cardBorder, textPrimary: c.textPrimary, textSecondary: c.textSecondary, textTertiary: c.textTertiary, navBg: c.navBg, mediaBg: c.mediaBg, iconMuted: c.iconMuted, tagBg: c.tagBg, tagBorder: c.tagBorder, tagText: c.tagText,
      comments: comments,
      commentCount: comments.length
    };
  }
}
</script>
</body>
</html>
