<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NetBuis — Forum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{bg}};color:{{textPrimary}};display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative">

  <div style="padding:20px 20px 16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <div>
      <div style="font-size:20px;font-weight:800">Forum</div>
      <div style="font-size:12px;color:{{textSecondary}};margin-top:2px">Publications des commerçants</div>
    </div>
    <button onClick="{{toggleTheme}}" aria-label="Changer de thème" style="width:36px;height:36px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>
      </sc-if>
    </button>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:16px">
    <sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
    <div style="background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:16px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 14px">
        <div style="width:34px;height:34px;border-radius:50%;background:{{accent}};color:#1A1200;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{p.initials}}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">{{p.business}}</div>
          <div style="font-size:11px;color:{{textSecondary}}">{{p.zone}} · {{p.time}}</div>
        </div>
      </div>
      <a href="Publication.dc.html" style="display:block;width:100%;height:180px;background:{{mediaBg}}">
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{iconMuted}}" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 15l5-5 4 4 5-6 4 5"></path><circle cx="8" cy="8.5" r="1.4"></circle></svg>
        </div>
      </a>
      <div style="padding:12px 14px 14px 14px">
        <div style="font-size:13px;line-height:1.4;color:{{textPrimary}}">{{p.caption}}</div>
        <sc-if value="{{p.hasTag}}" hint-placeholder-val="{{true}}">
        <div style="margin-top:10px;display:inline-block;background:{{tagBg}};border:1px solid {{tagBorder}};color:{{tagText}};font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px">{{p.tag}}</div>
        </sc-if>
        <a href="Publication.dc.html" style="margin-top:12px;padding-top:10px;border-top:1px solid {{cardBorder}};display:flex;align-items:center;gap:6px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
          <span style="font-size:12px;color:{{textSecondary}}">{{p.comments}} commentaires · écrire un commentaire</span>
        </a>
      </div>
    </div>
    </sc-for>
  </div>

  <sc-if value="{{isBusiness}}" hint-placeholder-val="{{true}}">
  <a href="Publier.dc.html" aria-label="Publier une annonce" style="position:absolute;right:20px;bottom:96px;width:52px;height:52px;border-radius:16px;background:{{accent}};display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,0.4)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.4"><path d="M12 5v14M5 12h14"></path></svg>
  </a>
  </sc-if>

  <div style="flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:12px 0 22px 0;background:{{navBg}};border-top:1px solid {{cardBorder}}">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Accueil</span>
    </a>
    <a href="Carte.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M9 20l-6 2V6l6-2 6 2 6-2v16l-6 2-6-2z"></path><path d="M9 4v16M15 6v16"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Carte</span>
    </a>
    <a href="Forum.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
      <span style="font-size:10px;color:{{accent}};font-weight:700">Forum</span>
    </a>
    <a href="Profil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-7 8-7s8 3 8 7"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Profil</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2942E"},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"isBusiness":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: (props && props.theme) || 'dark' };
    this.toggleTheme = this.toggleTheme.bind(this);
  }
  toggleTheme() {
    this.setState({ theme: this.state.theme === 'dark' ? 'light' : 'dark' });
  }
  renderVals() {
    const isDark = (this.state.theme || this.props.theme || 'dark') === 'dark';
    const dark = { bg: '#0D0D0F', cardBg: '#1B1B1E', cardBorder: '#2A2A2E', textPrimary: '#FFFFFF', textSecondary: '#9A9A9E', textTertiary: '#7A7A7E', navBg: '#121214', mediaBg: '#15151A', iconMuted: '#3A3A40', tagBg: '#262620', tagBorder: '#3A3A2E', tagText: '#F2942E' };
    const light = { bg: '#F7F7F8', cardBg: '#FFFFFF', cardBorder: '#E3E3E7', textPrimary: '#18181B', textSecondary: '#63636A', textTertiary: '#8E8E93', navBg: '#FFFFFF', mediaBg: '#EFEFF2', iconMuted: '#C8C8CE', tagBg: '#FBE7C8', tagBorder: '#F0D6A3', tagText: '#A6650A' };
    const c = isDark ? dark : light;
    return {
      accent: this.props.accent ?? '#F2942E',
      isDark: isDark,
      isLight: !isDark,
      toggleTheme: this.toggleTheme,
      isBusiness: this.props.isBusiness ?? true,
      bg: c.bg, cardBg: c.cardBg, cardBorder: c.cardBorder, textPrimary: c.textPrimary, textSecondary: c.textSecondary, textTertiary: c.textTertiary, navBg: c.navBg, mediaBg: c.mediaBg, iconMuted: c.iconMuted, tagBg: c.tagBg, tagBorder: c.tagBorder, tagText: c.tagText,
      posts: [
        { initials: 'MA', business: 'Boutique Mama Aïcha', zone: 'Dougoï', time: '2h', caption: 'Nouveau lot de riz parfumé disponible — 25kg et 50kg, prix de gros.', hasTag: true, tag: 'Riz 25kg', comments: 6 },
        { initials: 'IB', business: 'Couturier Ibrahim', zone: 'Domayo', time: '5h', caption: 'Modèles de boubous pour la rentrée, tissus wax et bazin disponibles.', hasTag: false, tag: '', comments: 2 },
        { initials: 'EL', business: 'Électricien qualifié', zone: 'Hardé', time: '1j', caption: 'Installation de panneaux solaires résidentiels, devis gratuit sur place.', hasTag: false, tag: '', comments: 0 }
      ]
    };
  }
}
</script>
</body>
</html>
