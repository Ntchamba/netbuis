<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NetBuis — Détail d'un quartier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{bg}};color:{{textPrimary}};display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative">

  <div style="padding:20px 20px 12px 20px;flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <a href="Carte.dc.html" style="display:inline-flex;align-items:center;gap:6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{textSecondary}}" stroke-width="2.2"><path d="M15 18l-6-6 6-6"></path></svg>
        <span style="font-size:13px;color:{{textSecondary}}">Quartiers</span>
      </a>
      <button onClick="{{toggleTheme}}" aria-label="Changer de thème" style="width:32px;height:32px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>
        </sc-if>
      </button>
    </div>
    <div style="font-size:11px;color:{{textTertiary}}">Cameroun · Maroua</div>
    <div style="font-size:22px;font-weight:800;margin-top:2px">Hardé</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 20px 20px 20px;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{listings}}" as="r" hint-placeholder-count="3">
    <div style="background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:16px;font-weight:700">{{r.title}}</div>
          <div style="font-size:13px;color:{{textSecondary}};margin-top:2px">{{r.subtitle}}</div>
        </div>
        <div style="background:{{badgeBg}};color:{{badgeText}};font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap">{{r.badge}}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;color:{{pin}};font-size:13px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{pin}}" stroke-width="2"><path d="M12 21s7-7.2 7-12a7 7 0 10-14 0c0 4.8 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
        <span>{{r.location}}</span>
      </div>
      <button onClick="{{r.call}}" style="margin-top:4px;background:{{accent}};border:none;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:#1A1200;font-size:14px;font-weight:700;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.4a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"></path></svg>
        Appeler pour {{r.price}}
      </button>
    </div>
    </sc-for>
  </div>

  <div style="flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:12px 0 22px 0;background:{{navBg}};border-top:1px solid {{cardBorder}}">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Accueil</span>
    </a>
    <a href="Carte.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2"><path d="M9 20l-6 2V6l6-2 6 2 6-2v16l-6 2-6-2z"></path><path d="M9 4v16M15 6v16"></path></svg>
      <span style="font-size:10px;color:{{accent}};font-weight:700">Carte</span>
    </a>
    <a href="Forum.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Forum</span>
    </a>
    <a href="Profil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-7 8-7s8 3 8 7"></path></svg>
      <span style="font-size:10px;color:{{textTertiary}};font-weight:600">Profil</span>
    </a>
  </div>

  <sc-if value="{{callVisible}}" hint-placeholder-val="{{false}}">
  <div style="position:absolute;inset:0;background:{{scrim}};display:flex;align-items:flex-end;z-index:40">
    <div style="width:100%;box-sizing:border-box;background:{{cardBg}};border-top:1px solid {{cardBorder}};border-radius:22px 22px 0 0;padding:22px 20px 28px 20px">

      <sc-if value="{{callChoose}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <div style="font-size:12px;color:{{textSecondary}}">Vous appelez</div>
          <div style="font-size:18px;font-weight:800;margin-top:2px">{{callTargetName}}</div>
        </div>
        <div style="font-size:14px;font-weight:700">Avec quelle ligne voulez-vous appeler ?</div>
        <button onClick="{{chooseOrange}}" style="display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;min-height:64px;background:{{bg}};border:2px solid #FF7900;border-radius:16px;padding:10px 16px;cursor:pointer;color:{{textPrimary}};text-align:left;font-family:inherit">
          <span style="width:40px;height:40px;border-radius:50%;background:#FF7900;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.4a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"></path></svg>
          </span>
          <span style="font-size:17px;font-weight:800">Orange</span>
        </button>
        <button onClick="{{chooseMtn}}" style="display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;min-height:64px;background:{{bg}};border:2px solid #FFCC00;border-radius:16px;padding:10px 16px;cursor:pointer;color:{{textPrimary}};text-align:left;font-family:inherit">
          <span style="width:40px;height:40px;border-radius:50%;background:#FFCC00;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.4a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"></path></svg>
          </span>
          <span style="font-size:17px;font-weight:800">MTN</span>
        </button>
        <button onClick="{{closeCall}}" style="background:transparent;border:none;color:{{textSecondary}};font-size:14px;font-weight:700;padding:8px;cursor:pointer;font-family:inherit">Annuler</button>
      </div>
      </sc-if>

      <sc-if value="{{callRunning}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:10px 0">
        <div style="width:56px;height:56px;border-radius:50%;background:{{operatorColor}};display:flex;align-items:center;justify-content:center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.4a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"></path></svg>
        </div>
        <div style="font-size:16px;font-weight:800">Appel en cours...</div>
        <div style="font-size:13px;color:{{textSecondary}}">{{callTargetName}} · ligne {{operatorName}}</div>
      </div>
      </sc-if>

    </div>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2942E"},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: (props && props.theme) || 'dark', callTarget: null, callOperator: null };
    this.toggleTheme = this.toggleTheme.bind(this);
    this.closeCall = this.closeCall.bind(this);
    this.chooseOrange = this.chooseOrange.bind(this);
    this.chooseMtn = this.chooseMtn.bind(this);
    this._callTimer = null;
  }
  // Appel direct (voir decision-finale-appels.md v2) : confirmation de la ligne (Orange ou MTN), puis l'appel part.
  openCall(title) {
    if (this.state.callTarget) { return; }
    this.setState({ callTarget: title, callOperator: null });
  }
  closeCall() {
    if (this._callTimer) { clearTimeout(this._callTimer); }
    this.setState({ callTarget: null, callOperator: null });
  }
  _startCall(op) {
    this.setState({ callOperator: op });
    if (this._callTimer) { clearTimeout(this._callTimer); }
    this._callTimer = setTimeout(() => {
      this.setState({ callTarget: null, callOperator: null });
    }, 2200);
  }
  chooseOrange() { this._startCall('orange'); }
  chooseMtn() { this._startCall('mtn'); }
  toggleTheme() {
    this.setState({ theme: this.state.theme === 'dark' ? 'light' : 'dark' });
  }
  renderVals() {
    const isDark = (this.state.theme || this.props.theme || 'dark') === 'dark';
    const dark = { bg: '#0D0D0F', cardBg: '#1B1B1E', cardBorder: '#2A2A2E', textPrimary: '#FFFFFF', textSecondary: '#9A9A9E', textTertiary: '#7A7A7E', navBg: '#121214', badgeBg: '#2A2A2E', badgeText: '#C8C8CC', pin: '#C8942E' };
    const light = { bg: '#F7F7F8', cardBg: '#FFFFFF', cardBorder: '#E3E3E7', textPrimary: '#18181B', textSecondary: '#63636A', textTertiary: '#8E8E93', navBg: '#FFFFFF', badgeBg: '#EFEFF2', badgeText: '#54545A', pin: '#9C6B00' };
    const c = isDark ? dark : light;
    return {
      accent: this.props.accent ?? '#F2942E',
      isDark: isDark,
      isLight: !isDark,
      toggleTheme: this.toggleTheme,
      bg: c.bg, cardBg: c.cardBg, cardBorder: c.cardBorder, textPrimary: c.textPrimary, textSecondary: c.textSecondary, textTertiary: c.textTertiary, navBg: c.navBg, badgeBg: c.badgeBg, badgeText: c.badgeText, pin: c.pin,
      scrim: isDark ? 'rgba(0,0,0,0.66)' : 'rgba(24,24,27,0.5)',
      callVisible: !!this.state.callTarget,
      callChoose: !!this.state.callTarget && !this.state.callOperator,
      callRunning: !!this.state.callTarget && !!this.state.callOperator,
      callTargetName: this.state.callTarget || '',
      operatorName: this.state.callOperator === 'mtn' ? 'MTN' : 'Orange',
      operatorColor: this.state.callOperator === 'mtn' ? '#FFCC00' : '#FF7900',
      chooseOrange: this.chooseOrange,
      chooseMtn: this.chooseMtn,
      closeCall: this.closeCall,
      listings: [
        { title: 'Électricien qualifié', subtitle: 'Disponible pour interventions rapides', badge: 'Service', location: 'À côté du Grand Manguier — Hardé', price: '5 FCFA' },
        { title: 'Quincaillerie Hardé', subtitle: 'Matériel électrique et plomberie', badge: 'Produit', location: 'Face à la pharmacie — Hardé', price: '5 FCFA' }
      ].map((r) => ({ title: r.title, subtitle: r.subtitle, badge: r.badge, location: r.location, price: r.price, call: () => this.openCall(r.title) }))
    };
  }
}
</script>
</body>
</html>
