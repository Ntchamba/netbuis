<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NetBuis — Nouvelle publication</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
textarea{font-family:inherit}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:{{bg}};color:{{textPrimary}};display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;position:relative">

  <div style="padding:20px 20px 16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid {{cardBorder}}">
    <a href="Forum.dc.html" aria-label="Fermer" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="font-size:15px;font-weight:700">Nouvelle publication</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onClick="{{toggleTheme}}" aria-label="Changer de thème" style="width:30px;height:30px;border-radius:50%;background:{{cardBg}};border:1px solid {{cardBorder}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{textPrimary}}" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>
        </sc-if>
      </button>
      <button style="background:{{accent}};border:none;border-radius:999px;padding:8px 16px;color:#1A1200;font-size:13px;font-weight:700">Publier</button>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px">

    <div style="width:100%;height:220px;border-radius:16px;border:1.5px dashed {{dashedMedia}};background:{{mediaBg}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 15l5-5 4 4 5-6 4 5"></path><circle cx="8" cy="8.5" r="1.4"></circle></svg>
      <span style="font-size:13px;color:{{textSecondary}}">Ajouter une photo ou une vidéo</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="font-size:12px;color:{{textSecondary}};font-weight:600">Légende</label>
      <textarea placeholder="Décrivez votre produit ou votre service..." style="width:100%;min-height:90px;background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:12px 14px;color:{{textPrimary}};font-size:14px;resize:none;box-sizing:border-box"></textarea>
    </div>

    <a href="#" style="background:{{cardBg}};border:1px solid {{cardBorder}};border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:12px;color:{{textSecondary}}">Associer un produit (optionnel)</div>
        <div style="font-size:14px;font-weight:600;margin-top:2px">Aucun produit sélectionné</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{textTertiary}}" stroke-width="2"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="font-size:12px;color:{{textTertiary}};line-height:1.5">Visible par tous les utilisateurs de NetBuis dans le fil Forum, à partir de votre compte Business.</div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2942E"},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: (props && props.theme) || 'dark' };
    this.toggleTheme = this.toggleTheme.bind(this);
  }
  toggleTheme() {
    this.setState({ theme: this.state.theme === 'dark' ? 'light' : 'dark' });
  }
  renderVals() {
    const isDark = (this.state.theme || this.props.theme || 'dark') === 'dark';
    const dark = { bg: '#0D0D0F', cardBg: '#1B1B1E', cardBorder: '#2A2A2E', textPrimary: '#FFFFFF', textSecondary: '#9A9A9E', textTertiary: '#7A7A7E', mediaBg: '#15151A', dashedMedia: '#3A3A40' };
    const light = { bg: '#F7F7F8', cardBg: '#FFFFFF', cardBorder: '#E3E3E7', textPrimary: '#18181B', textSecondary: '#63636A', textTertiary: '#8E8E93', mediaBg: '#EFEFF2', dashedMedia: '#C9C9CE' };
    const c = isDark ? dark : light;
    return {
      accent: this.props.accent ?? '#F2942E',
      isDark: isDark,
      isLight: !isDark,
      toggleTheme: this.toggleTheme,
      bg: c.bg, cardBg: c.cardBg, cardBorder: c.cardBorder, textPrimary: c.textPrimary, textSecondary: c.textSecondary, textTertiary: c.textTertiary, mediaBg: c.mediaBg, dashedMedia: c.dashedMedia
    };
  }
}
</script>
</body>
</html>
