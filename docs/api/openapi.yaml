          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AccessResponse:
      type: object
      properties:
        access:
          type: string
          description: Jeton d'accès, valable 15 min. Le jeton de rafraîchissement
            est posé dans le cookie HttpOnly netbuis_refresh.
      required:
      - access
    AdminLogin:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - phone
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
      required:
      - phone
    OtpRequestResponse:
      type: object
      properties:
        expires_in:
          type: integer
          description: Validité du code, en secondes
      required:
      - expires_in
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
        code:
          type: string
          description: Code à 6 chiffres reçu par SMS
          maxLength: 6
      required:
      - code
      - phone
    OtpVerifyResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        is_new:
          type: boolean
          description: Vrai si le compte vient d'être créé
      required:
      - access
      - is_new
      - refresh
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          description: 'Application mobile : jeton de rafraîchissement. Dashboard
            : laisser vide, le jeton est lu dans le cookie HttpOnly netbuis_refresh.'
    RefreshResponse:
      type: object
      properties:
        access:
          type: string
          description: Jeton d'accès, valable 15 min
        refresh:
          type: string
          description: 'Nouveau jeton de rafraîchissement (30 jours) ; l''ancien n''est
            plus valable. Absent pour le dashboard : il est reposé dans le cookie.'
      required:
      - access
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
