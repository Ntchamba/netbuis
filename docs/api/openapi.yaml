openapi: 3.0.3
info:
  title: NetBuis API
  version: 0.1.0
  description: 'Contrat d''API NetBuis (source de vérité : docs/api/openapi.yaml)'
paths:
  /api/admin/accounts/:
    get:
      operationId: admin_accounts_list
      description: Comptes, du plus récent au plus ancien, paginés. Numéro toujours
        masqué.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Nom du compte ou du commerce, ou numéro (chiffres, 3 au moins
          ; Administrateur complet seulement, ignoré pour un Validateur) ; le numéro
          reste masqué dans la réponse
      - in: query
        name: type
        schema:
          type: string
          enum:
          - all
          - blocked
          - business
          - deleted
          - simple
        description: all (défaut), simple, business, blocked, deleted
      - in: query
        name: zone
        schema:
          type: integer
        description: 'Zone (ville, quartier…) : comptes business situés dans cette
          zone ou celles qu''elle contient'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_type / invalid_zone
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/:
    get:
      operationId: admin_accounts_retrieve
      description: 'Vue détaillée : identité, type, profil business et pièces (URL
        temporaires de 5 min liées à l''administrateur), historique de statuts, dernières
        actions d''audit. `phone` (numéro complet) n''est renvoyé qu''à l''Administrateur
        complet et chaque affichage est audité (`consultation_numero`) ; sinon il
        vaut null.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
    delete:
      operationId: admin_accounts_delete
      description: Suppression DOUCE (`is_deleted`, `deleted_at`) avec motif obligatoire
        dans le corps ; jetons de rafraîchissement invalidés. Audit `suppression_compte`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required (motif manquant, rien n'est écrit) ou self_action_forbidden
            (action sur son propre compte)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/block/:
    post:
      operationId: admin_accounts_block
      description: 'Bloque le compte (motif obligatoire, 255 caractères au plus) :
        plus de connexion, jetons invalidés, disparu de la recherche, des fiches et
        des appels. Audit `blocage_compte`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountReason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountReason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountReason'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required (motif manquant, rien n'est écrit) ou self_action_forbidden
            (action sur son propre compte)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/restore/:
    post:
      operationId: admin_accounts_restore
      description: Restaure un compte supprimé. Audit `restauration_compte`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/unblock/:
    post:
      operationId: admin_accounts_unblock
      description: Débloque le compte. Audit `deblocage_compte`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required (motif manquant, rien n'est écrit) ou self_action_forbidden
            (action sur son propre compte)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/me/:
    get:
      operationId: admin_me_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou compte bloqué/supprimé
  /api/admin/private-files/{token}/:
    get:
      operationId: admin_private_file_retrieve
      description: Sert une pièce privée à l'administrateur désigné par le jeton,
        et à lui seul.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: La pièce (image)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_link : jeton faux, expiré ou lié à un autre administrateur'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
  /api/admin/requests/:
    get:
      operationId: admin_requests_list
      description: 'File d''attente des comptes business en attente (les plus anciens
        d''abord). `cni_url` et `diplome_url` sont des URL temporaires (5 minutes)
        liées à l''administrateur qui les reçoit : à ouvrir avec son jeton d''accès
        via `GET /api/admin/private-files/<jeton>/`. Le numéro est masqué.'
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
        description: 'Seule valeur : business'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessRequestList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_type
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/requests/{id}/approve/:
    post:
      operationId: admin_requests_approve
      description: Passe le compte à `actif` ; pour un prestataire, la CNI est marquée
        vérifiée du même geste. Écrit l'audit `validation_business`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDecision'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'already_processed : la demande a déjà été traitée'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/requests/{id}/reject/:
    post:
      operationId: admin_requests_reject
      description: Rejette le compte avec un motif obligatoire, que le commerçant
        lit dans `motif_rejet` (`/api/business/me/`). Écrit l'audit `rejet_business`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDecision'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'already_processed : la demande a déjà été traitée'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/auth/admin/login/:
    post:
      operationId: auth_admin_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
          description: 'Connecté. En-tête Set-Cookie : netbuis_refresh (HttpOnly,
            SameSite=Lax, Secure hors développement, Path=/api/auth/, 30 jours).'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : champ manquant'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_credentials : « Numéro ou mot de passe incorrect.
            » — même réponse si le compte n''existe pas, n''est pas administrateur,
            est bloqué ou supprimé'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_many_requests : 5 essais ratés en 15 min depuis cette
            IP (en-tête Retry-After en secondes)'
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      parameters:
      - in: cookie
        name: netbuis_refresh
        schema:
          type: string
        description: 'Dashboard : jeton de rafraîchissement (cookie HttpOnly posé
          par admin/login)'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '204':
          description: 'Déconnecté : le jeton de rafraîchissement ne peut plus servir
            ; le cookie du dashboard est effacé.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'token_invalid : jeton absent, faux, expiré ou déjà invalidé'
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_phone : numéro non camerounais mobile ; invalid :
            champ manquant'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_many_requests : 3 demandes / 10 min par numéro, 10 / heure
            par IP, ou numéro bloqué 1 heure après 5 codes faux (en-tête Retry-After
            en secondes)'
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_phone ; otp_invalid : code faux, déjà utilisé ou remplacé
            ; otp_expired : plus de 5 min ; invalid : champ manquant'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_many_requests : 5 essais ratés (demander un nouveau code),
            30 vérifications / heure par IP, ou numéro bloqué 1 heure après 5 codes
            faux (en-tête Retry-After en secondes)'
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      parameters:
      - in: cookie
        name: netbuis_refresh
        schema:
          type: string
        description: 'Dashboard : jeton de rafraîchissement (cookie HttpOnly posé
          par admin/login)'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: 'Nouveau couple ; l''ancien jeton de rafraîchissement n''est
            plus valable. Dashboard : seul access est dans le corps, le cookie est
            reposé.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'token_invalid : jeton absent, faux, expiré ou déjà utilisé'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
  /api/business/:
    post:
      operationId: business_create
      tags:
      - business
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessProfile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : `fields` donne l''erreur de chaque champ (champ
            obligatoire selon le type, lieu trop haut, valeur inconnue…) ; SUBSCRIPTION_REQUIRED
            : plus de 3 sous-catégories, rayons ou spécialités sans abonnement actif'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated / token_not_valid : jeton d''accès absent,
            faux ou expiré'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'business_exists : ce compte a déjà un compte business'
  /api/business/{id}/:
    get:
      operationId: business_public_detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - business
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBusiness'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Non connecté.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: account_blocked / account_deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found : profil absent ou non actif'
  /api/business/me/:
    get:
      operationId: business_me_retrieve
      tags:
      - business
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'no_business : ce compte n''a pas de compte business'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated / token_not_valid : jeton d''accès absent,
            faux ou expiré'
        '403':
          content:
            application/json:
