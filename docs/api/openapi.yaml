openapi: 3.0.3
info:
  title: NetBuis API
  version: 0.1.0
  description: 'Contrat d''API NetBuis (source de vérité : docs/api/openapi.yaml)'
paths:
  /api/admin/accounts/:
    get:
      operationId: admin_accounts_list
      description: Comptes, du plus récent au plus ancien, paginés. Numéro toujours
        masqué.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Nom du compte ou du commerce, ou numéro (chiffres, 3 au moins
          ; Administrateur complet seulement, ignoré pour un Validateur) ; le numéro
          reste masqué dans la réponse
      - in: query
        name: type
        schema:
          type: string
          enum:
          - all
          - blocked
          - business
          - deleted
          - simple
        description: all (défaut), simple, business, blocked, deleted
      - in: query
        name: zone
        schema:
          type: integer
        description: 'Zone (ville, quartier…) : comptes business situés dans cette
          zone ou celles qu''elle contient'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_type / invalid_zone
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/:
    get:
      operationId: admin_accounts_retrieve
      description: 'Vue détaillée : identité, type, profil business et pièces (URL
        temporaires de 5 min liées à l''administrateur), historique de statuts, dernières
        actions d''audit. `phone` (numéro complet) n''est renvoyé qu''à l''Administrateur
        complet et chaque affichage est audité (`consultation_numero`) ; sinon il
        vaut null.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
    delete:
      operationId: admin_accounts_delete
      description: Suppression DOUCE (`is_deleted`, `deleted_at`) avec motif obligatoire
        dans le corps ; jetons de rafraîchissement invalidés. Audit `suppression_compte`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required (motif manquant, rien n'est écrit) ou self_action_forbidden
            (action sur son propre compte)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/block/:
    post:
      operationId: admin_accounts_block
      description: 'Bloque le compte (motif obligatoire, 255 caractères au plus) :
        plus de connexion, jetons invalidés, disparu de la recherche, des fiches et
        des appels. Audit `blocage_compte`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountReason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountReason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountReason'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required (motif manquant, rien n'est écrit) ou self_action_forbidden
            (action sur son propre compte)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/restore/:
    post:
      operationId: admin_accounts_restore
      description: Restaure un compte supprimé. Audit `restauration_compte`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/accounts/{id}/unblock/:
    post:
      operationId: admin_accounts_unblock
      description: Débloque le compte. Audit `deblocage_compte`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: reason_required (motif manquant, rien n'est écrit) ou self_action_forbidden
            (action sur son propre compte)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_state, ou last_full_admin (dernier Administrateur complet
            actif)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/admins/:
    get:
      operationId: admin_admins_list
      description: Comptes ayant un rôle d'administration, numéros masqués, paginés.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou sans peut_gerer_admins
    post:
      operationId: admin_admins_create
      description: Crée un compte Validateur ou Administrateur complet (jamais d'auto-inscription).
        Un mot de passe temporaire est généré et renvoyé UNE SEULE FOIS (`temporary_password`)
        ; il n'est ni stocké en clair ni journalisé. Le changement de ce mot de passe
        n'est pas imposé à la première connexion. Un numéro déjà utilisé est refusé
        (409 `phone_exists`). Audit `attribution_role`.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_phone / invalid_role / reason_required / self_action_forbidden
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: phone_exists / invalid_state / last_full_admin
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou sans peut_gerer_admins
  /api/admin/admins/{id}/:
    patch:
      operationId: admin_admins_update_role
      description: Change le rôle d'un administrateur. Pas sur soi-même ; le dernier
        Administrateur complet actif ne peut pas être rétrogradé. Audit `attribution_role`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminRole'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_phone / invalid_role / reason_required / self_action_forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: phone_exists / invalid_state / last_full_admin
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou sans peut_gerer_admins
    delete:
      operationId: admin_admins_remove
      description: Retire tout rôle d'administration (le compte n'est pas supprimé),
        motif obligatoire ; jetons de rafraîchissement invalidés. Pas sur soi-même
        ; pas sur le dernier Administrateur complet actif. Audit `retrait_role`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_phone / invalid_role / reason_required / self_action_forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: phone_exists / invalid_state / last_full_admin
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou sans peut_gerer_admins
  /api/admin/analytics/calls/:
    get:
      operationId: admin_analytics_calls
      description: 'Appels par jour (zéros compris), par opérateur (orange, mtn, unknown),
        par plateforme et par canal. Agrégats seulement : ni appelant ni commerçant
        identifiable.'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 'Fenêtre en jours calendaires, aujourd''hui compris : 1 à 90,
          7 par défaut'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAnalytics'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_days
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/analytics/searches/:
    get:
      operationId: admin_analytics_searches
      description: 'Termes de recherche les plus fréquents et recherches sans résultat
        (50 termes au plus, par fréquence). Agrégats seulement : jamais de compte
        ni de numéro ; un terme contenant 6 chiffres ou plus est écarté.'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 'Fenêtre en jours calendaires, aujourd''hui compris : 1 à 90,
          7 par défaut'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnalytics'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_days
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, sans la permission, ou compte
            bloqué
  /api/admin/audit/:
    get:
      operationId: admin_audit_list
      description: Journal d'audit en lecture seule, du plus récent au plus ancien,
        paginé. Le motif est affiché mais tout numéro, code, jeton ou lien y est masqué.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - accord_abonnement
          - attribution_role
          - blocage_compte
          - consultation_numero
          - creation_referentiel
          - deblocage_compte
          - desactivation_referentiel
          - export_comptes
          - moderation_contenu
          - modification_referentiel
          - modification_reglage
          - reactivation_referentiel
          - rejet_business
          - restauration_compte
          - retrait_role
          - suppression_compte
          - validation_business
      - in: query
        name: admin
        schema:
          type: integer
        description: Identifiant de l'administrateur
      - in: query
        name: from
        schema:
          type: string
        description: Jour AAAA-MM-JJ, inclus (fuseau du projet)
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: Jour AAAA-MM-JJ, inclus (fuseau du projet)
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_filter
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Droit manquant
  /api/admin/export/accounts.csv:
    get:
      operationId: admin_export_accounts
      description: 'Export CSV (UTF-8) de tous les comptes : id, nom, téléphone MASQUÉ,
        type, statut, langue, administrateur, commerce, statut du dossier, zone, date
        de création. Sans numéro complet, CNI, pièces, jetons ni mot de passe. Cellules
        neutralisées contre l''injection de formule. Chaque export est audité (`export_comptes`).
        `Cache-Control: no-store`.'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Fichier CSV
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou sans peut_exporter
  /api/admin/forbidden-words/:
    get:
      operationId: admin_forbidden_words_list
      description: Mots interdits du forum (normalisés), par ordre alphabétique, paginés.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedForbiddenWordList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas Administrateur complet (le Validateur ne modère pas)
    post:
      operationId: admin_forbidden_words_create
      description: Ajoute un mot interdit (stocké sans accents ni majuscules ; comparaison
        par mots entiers). Audit `moderation_contenu`.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForbiddenWordCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForbiddenWordCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForbiddenWordCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenWord'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: word_exists
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas Administrateur complet (le Validateur ne modère pas)
  /api/admin/forbidden-words/{id}/:
    delete:
      operationId: admin_forbidden_words_delete
      description: Retire un mot interdit. Audit `moderation_contenu`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas Administrateur complet (le Validateur ne modère pas)
  /api/admin/me/:
    get:
      operationId: admin_me_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Jeton absent ou invalide
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Pas administrateur, sans groupe, ou compte bloqué/supprimé
  /api/admin/private-files/{token}/:
    get:
      operationId: admin_private_file_retrieve
