  /api/uploads/local/{token}/:
    put:
      operationId: uploads_local_put
      description: Corps binaire du fichier, avec le `Content-Type` donné par `uploads/sign/`.
        Réservé au stockage local de développement. Une adresse ne sert qu'une fois.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - uploads
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      security:
      - {}
      responses:
        '204':
          description: Fichier enregistré.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_type : Content-Type différent de celui annoncé · invalid_content
            : les octets ne sont pas ceux du type annoncé, ou taille différente'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_token : adresse falsifiée ou expirée · already_used
            : déjà servie'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_large : plus gros que la taille annoncée'
  /api/uploads/sign/:
    post:
      operationId: uploads_sign
      description: Donne l'adresse où envoyer UN fichier (PUT, corps binaire, en-têtes
        `headers`), puis `key` à mettre dans le profil. `cni_photo` et `diplome_photo`
        vont dans un espace privé, sans adresse publique.
      tags:
      - uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadSignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadSignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_kind : type d''envoi inconnu · invalid_type : type
            de fichier refusé (SVG, GIF, HTML…) · too_large : plus de 5 Mo (images)
            ou 30 Mo (vidéo) · invalid : taille absente, nulle ou pas un nombre entier'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated / token_not_valid : jeton d''accès absent,
            faux ou expiré'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'throttled : 60 demandes par heure et par compte'
  /api/zones/:
    get:
      operationId: zones_list
      parameters:
      - in: query
        name: level
        schema:
          type: string
          enum:
          - arrondissement
          - departement
          - pays
          - quartier
          - region
          - repere
          - ville_village
        description: Niveau des zones voulues.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
        description: Identifiant de la zone parente.
      tags:
      - zones
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZoneList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : `level` ou `parent` incorrect'
  /api/zones/{id}/:
    get:
      operationId: zones_retrieve
      parameters:
      - in: path
        name: id
