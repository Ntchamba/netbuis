        * `rejete` - Rejeté
    StructureType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Code stable
          description: Minuscules sans accents (ex. centre_sante).
        name:
          type: string
          readOnly: true
          title: Nom
        icon:
          type: string
          readOnly: true
          title: Icône
        order:
          type: integer
          readOnly: true
          title: Ordre
      required:
      - code
      - icon
      - id
      - name
      - order
    Subcategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Code stable
          description: Unique dans le secteur (ex. fruits).
        name:
          type: string
          readOnly: true
          title: Nom
        icon:
          type: string
          readOnly: true
          title: Icône
        order:
          type: integer
          readOnly: true
          title: Ordre
      required:
      - code
      - icon
      - id
      - name
      - order
    Suggestion:
      type: object
      properties:
        text:
          type: string
          description: Texte à proposer (et à chercher si on le choisit).
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          description: |-
            « produit » : du catalogue ; « recherche » : terme souvent cherché.

            * `produit` - produit
            * `recherche` - recherche
      required:
      - text
      - type
    TypeCompteEnum:
      enum:
      - boutique
      - entreprise
      - particulier_vendeur
      - prestataire_service
      - structure
      type: string
      description: |-
        * `boutique` - Commerce
        * `entreprise` - Entreprise
        * `particulier_vendeur` - Particulier vendeur
        * `prestataire_service` - Prestataire de service
        * `structure` - Structure
    TypeEnum:
      enum:
      - produit
      - recherche
      type: string
      description: |-
        * `produit` - produit
        * `recherche` - recherche
    UploadSignRequest:
      type: object
      properties:
        kind:
          type: string
          description: 'Nature du fichier : photo, representant_photo, cni_photo,
            diplome_photo, post_image, post_video. cni_photo et diplome_photo sont
            PRIVÉS.'
          maxLength: 40
        content_type:
          type: string
          description: image/jpeg, image/png ou image/webp ; video/mp4 pour post_video
            seulement.
          maxLength: 100
        size:
          type: integer
          description: 'Taille exacte du fichier en octets : 1 à 5 242 880 (images),
            1 à 31 457 280 (vidéo de publication).'
      required:
      - content_type
      - kind
      - size
    UploadSignResponse:
      type: object
      properties:
        key:
          type: string
          description: Clé à mettre ensuite dans le profil (photo, cni_photo…).
        upload_url:
          type: string
          description: Adresse où envoyer le fichier (PUT, corps binaire).
        method:
          type: string
          description: Toujours PUT.
        headers:
          type: object
          additionalProperties:
            type: string
          description: En-têtes à envoyer tels quels (Content-Type).
        expires_in:
          type: integer
          description: Secondes de validité de l'adresse d'envoi.
      required:
      - expires_in
      - headers
      - key
      - method
      - upload_url
    VoiceQuery:
      type: object
      description: 'Recherche vocale : `text` = phrase reconnue par le téléphone (`q`
        n''est pas utilisé).'
      properties:
        zone:
          type: integer
          nullable: true
          description: Identifiant de la ville, du quartier… (inclut ce qu'elle contient).
        sector:
          type: string
          default: ''
          description: Code stable du secteur (ex. alimentation).
        text:
          type: string
          description: Texte reconnu par le téléphone, ex. « je cherche du riz à Akwa
            ».
          maxLength: 300
      required:
      - text
    VoiceSearchPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        q:
          type: string
          description: Le terme cherché après nettoyage.
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - count
      - next
      - previous
      - q
      - results
    WhatsAppReport:
      type: object
      properties:
        business_id:
          type: integer
          minimum: 1
      required:
      - business_id
    WhatsAppReportResponse:
      type: object
      properties:
