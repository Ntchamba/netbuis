openapi: 3.0.3
info:
  title: NetBuis API
  version: 0.1.0
  description: 'Contrat d''API NetBuis (source de vérité : docs/api/openapi.yaml)'
paths:
  /api/auth/admin/login/:
    post:
      operationId: auth_admin_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
          description: 'Connecté. En-tête Set-Cookie : netbuis_refresh (HttpOnly,
            SameSite=Lax, Secure hors développement, Path=/api/auth/, 30 jours).'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : champ manquant'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_credentials : « Numéro ou mot de passe incorrect.
            » — même réponse si le compte n''existe pas, n''est pas administrateur,
            est bloqué ou supprimé'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_many_requests : 5 essais ratés en 15 min depuis cette
            IP (en-tête Retry-After en secondes)'
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      parameters:
      - in: cookie
        name: netbuis_refresh
        schema:
          type: string
        description: 'Dashboard : jeton de rafraîchissement (cookie HttpOnly posé
          par admin/login)'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '204':
          description: 'Déconnecté : le jeton de rafraîchissement ne peut plus servir
            ; le cookie du dashboard est effacé.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'token_invalid : jeton absent, faux, expiré ou déjà invalidé'
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_phone : numéro non camerounais mobile ; invalid :
            champ manquant'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_many_requests : 3 demandes / 10 min par numéro, 10 / heure
            par IP, ou numéro bloqué 1 heure après 5 codes faux (en-tête Retry-After
            en secondes)'
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_phone ; otp_invalid : code faux, déjà utilisé ou remplacé
            ; otp_expired : plus de 5 min ; invalid : champ manquant'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'too_many_requests : 5 essais ratés (demander un nouveau code),
            30 vérifications / heure par IP, ou numéro bloqué 1 heure après 5 codes
            faux (en-tête Retry-After en secondes)'
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      parameters:
      - in: cookie
        name: netbuis_refresh
        schema:
          type: string
        description: 'Dashboard : jeton de rafraîchissement (cookie HttpOnly posé
          par admin/login)'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: 'Nouveau couple ; l''ancien jeton de rafraîchissement n''est
            plus valable. Dashboard : seul access est dans le corps, le cookie est
            reposé.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'token_invalid : jeton absent, faux, expiré ou déjà utilisé'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
  /api/catalog/products/:
    get:
      operationId: catalog_products_list
      summary: Complétion des produits du catalogue
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Début ou morceau du nom (ou d'un synonyme), 100 caractères au
          plus. Sans accents ni majuscules.
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogProduct'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : `q` absent, vide ou trop long'
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated / token_not_valid : jeton d''accès absent,
            faux ou expiré'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
    patch:
      operationId: me_partial_update
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : nom trop long ou langue inconnue (fr, en)'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated / token_not_valid : jeton d''accès absent,
            faux ou expiré'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
    delete:
      operationId: me_destroy
      tags:
      - account
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Compte supprimé (suppression douce) ; tous les jetons sont
            invalidés. Une reconnexion avec ce numéro reçoit « Contactez le support
            ».
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated / token_not_valid : jeton d''accès absent,
            faux ou expiré'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_blocked / account_deleted : « Contactez le support
            »'
  /api/referentials/sectors/:
    get:
      operationId: referentials_sectors_list
      summary: Secteurs d'activité avec leurs sous-catégories
      tags:
      - referentials
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
          description: ''
  /api/referentials/service-categories/:
    get:
      operationId: referentials_service_categories_list
      summary: Catégories de service (prestataires)
      tags:
      - referentials
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCategory'
          description: ''
  /api/referentials/structure-types/:
    get:
      operationId: referentials_structure_types_list
      summary: Types de structure
      tags:
      - referentials
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureType'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/zones/:
    get:
      operationId: zones_list
      parameters:
      - in: query
        name: level
        schema:
          type: string
          enum:
          - arrondissement
          - departement
          - pays
          - quartier
          - region
          - repere
          - ville_village
        description: Niveau des zones voulues.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
        description: Identifiant de la zone parente.
      tags:
      - zones
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZoneList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid : `level` ou `parent` incorrect'
  /api/zones/{id}/:
    get:
      operationId: zones_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - zones
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found : zone inconnue ou désactivée'
components:
  schemas:
    AccessResponse:
      type: object
      properties:
        access:
          type: string
          description: Jeton d'accès, valable 15 min. Le jeton de rafraîchissement
            est posé dans le cookie HttpOnly netbuis_refresh.
      required:
      - access
    AdminLogin:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - phone
    CatalogProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nom
        sector:
          type: string
          nullable: true
          readOnly: true
          description: Code du secteur, ou null.
        subcategory:
          type: string
          nullable: true
          readOnly: true
          description: Code de la sous-catégorie, ou null.
      required:
      - id
      - name
      - sector
      - subcategory
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    LanguageEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    LevelEnum:
      enum:
      - pays
      - region
      - departement
      - arrondissement
      - ville_village
      - quartier
      - repere
      type: string
      description: |-
        * `pays` - Pays
        * `region` - Région
        * `departement` - Département
        * `arrondissement` - Arrondissement
        * `ville_village` - Ville / village
        * `quartier` - Quartier
        * `repere` - Repère
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom
          description: Facultatif ; 120 caractères au plus
          maxLength: 120
        phone_masked:
          type: string
          readOnly: true
          description: 'Numéro masqué : seuls le premier et les deux derniers chiffres
            restent'
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          title: Langue
        has_business:
          type: boolean
          readOnly: true
          description: Vrai si le compte a un compte business (quel que soit son statut)
        free_call_available:
          type: integer
          nullable: true
          readOnly: true
          description: Appels gratuits restants aujourd'hui ; null tant que CREDITS_ENABLED=False
        credits_balance:
          type: integer
          nullable: true
          readOnly: true
          description: Solde de crédits en FCFA ; null tant que CREDITS_ENABLED=False
      required:
      - credits_balance
      - free_call_available
      - has_business
      - id
      - phone_masked
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
      required:
      - phone
    OtpRequestResponse:
      type: object
      properties:
        expires_in:
          type: integer
          description: Validité du code, en secondes
      required:
      - expires_in
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
        code:
          type: string
          description: Code à 6 chiffres reçu par SMS
          maxLength: 6
      required:
      - code
      - phone
    OtpVerifyResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        is_new:
          type: boolean
          description: Vrai si le compte vient d'être créé
      required:
      - access
      - is_new
      - refresh
    PaginatedZoneList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
    PatchedMe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom
          description: Facultatif ; 120 caractères au plus
          maxLength: 120
        phone_masked:
          type: string
          readOnly: true
          description: 'Numéro masqué : seuls le premier et les deux derniers chiffres
            restent'
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          title: Langue
        has_business:
          type: boolean
          readOnly: true
          description: Vrai si le compte a un compte business (quel que soit son statut)
        free_call_available:
          type: integer
          nullable: true
          readOnly: true
          description: Appels gratuits restants aujourd'hui ; null tant que CREDITS_ENABLED=False
        credits_balance:
          type: integer
          nullable: true
          readOnly: true
          description: Solde de crédits en FCFA ; null tant que CREDITS_ENABLED=False
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          description: 'Application mobile : jeton de rafraîchissement. Dashboard
            : laisser vide, le jeton est lu dans le cookie HttpOnly netbuis_refresh.'
    RefreshResponse:
      type: object
      properties:
        access:
          type: string
          description: Jeton d'accès, valable 15 min
        refresh:
          type: string
          description: 'Nouveau jeton de rafraîchissement (30 jours) ; l''ancien n''est
            plus valable. Absent pour le dashboard : il est reposé dans le cookie.'
      required:
      - access
    Sector:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Code stable
          description: Minuscules sans accents (ex. alimentation). Ne pas le changer
            une fois publié.
        name:
          type: string
          readOnly: true
          title: Nom
        icon:
          type: string
          readOnly: true
          title: Icône
        order:
          type: integer
          readOnly: true
          title: Ordre
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
          readOnly: true
          description: Sous-catégories actives du secteur, triées par ordre puis nom.
      required:
      - code
      - icon
      - id
      - name
      - order
      - subcategories
    ServiceCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Code stable
          description: Minuscules sans accents (ex. evenementiel).
        name:
          type: string
          readOnly: true
          title: Nom
        icon:
          type: string
          readOnly: true
          title: Icône
        order:
          type: integer
          readOnly: true
          title: Ordre
      required:
      - code
      - icon
      - id
      - name
      - order
    StructureType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Code stable
          description: Minuscules sans accents (ex. centre_sante).
        name:
          type: string
          readOnly: true
          title: Nom
        icon:
          type: string
          readOnly: true
          title: Icône
        order:
          type: integer
          readOnly: true
          title: Ordre
      required:
      - code
      - icon
      - id
      - name
      - order
    Subcategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Code stable
          description: Unique dans le secteur (ex. fruits).
        name:
          type: string
          readOnly: true
          title: Nom
        icon:
          type: string
          readOnly: true
          title: Icône
        order:
          type: integer
          readOnly: true
          title: Ordre
      required:
      - code
      - icon
      - id
      - name
      - order
    Zone:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nom
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          readOnly: true
          title: Niveau
        parent:
          type: integer
          readOnly: true
          nullable: true
        official_code:
          type: string
          readOnly: true
          title: Code officiel
        order:
          type: integer
          readOnly: true
          title: Ordre
        latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
      required:
      - id
      - latitude
      - level
      - longitude
      - name
      - official_code
      - order
      - parent
    ZoneDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nom
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          readOnly: true
          title: Niveau
        parent:
          type: integer
          readOnly: true
          nullable: true
        official_code:
          type: string
          readOnly: true
          title: Code officiel
        order:
          type: integer
          readOnly: true
          title: Ordre
        latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        path:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
          description: Les parents du pays jusqu'à la zone incluse (id, nom, niveau).
      required:
      - id
      - latitude
      - level
      - longitude
      - name
      - official_code
      - order
      - parent
      - path
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
