components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
      required:
      - phone
    OtpRequestResponse:
      type: object
      properties:
        expires_in:
          type: integer
          description: Validité du code, en secondes
      required:
      - expires_in
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
          description: 6XXXXXXXX, avec ou sans +237
          maxLength: 20
        code:
          type: string
          description: Code à 6 chiffres reçu par SMS
          maxLength: 6
      required:
      - code
      - phone
    OtpVerifyResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        is_new:
          type: boolean
          description: Vrai si le compte vient d'être créé
      required:
      - access
      - is_new
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
