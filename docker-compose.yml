# NetBuis en local avec Docker : `docker compose up --build`.
#   - db         : PostgreSQL (pg_trgm + unaccent créés au premier démarrage)
#   - api        : le serveur sur http://localhost:8000 (réglages de DÉVELOPPEMENT : jamais en production)
#   - expire_calls : ferme les sonneries oubliées
#   - dashboard  : le tableau de bord sur http://localhost:8080
# Les mots de passe ci-dessous sont des valeurs de développement local jetables. Rien de réel ici.
# Premier administrateur : docker compose exec api python manage.py createsuperuser
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: netbuis
      POSTGRES_PASSWORD: netbuis
      POSTGRES_DB: netbuis
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - netbuis_pg:/var/lib/postgresql/data
      - ./backend/scripts/create_extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbuis"]
      interval: 5s
      retries: 10

  api: &api
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-compose-dev-only-not-a-secret-32-octets-minimum}
      DATABASE_URL: postgres://netbuis:netbuis@db:5432/netbuis
      # Local seulement (émulateur Android = 10.0.2.2, téléphone sur le Wi-Fi = adresse de l'ordinateur).
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      SMS_PROVIDER: console
      WEB_CONCURRENCY: "1"
      JITSI_DOMAIN: ${JITSI_DOMAIN:-}
      JITSI_APP_ID: ${JITSI_APP_ID:-}
      JITSI_JWT_SECRET: ${JITSI_JWT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - netbuis_media:/app/backend/media
      - netbuis_private:/app/backend/private_media

  expire_calls:
    <<: *api
    ports: []
    # Attend que le serveur ait appliqué les migrations, puis ferme les sonneries oubliées toutes les 30 s.
    command: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'expire_calls : migrations pas encore appliquées, nouvel essai dans 5 s'; sleep 5; done; exec python manage.py expire_calls --loop 30"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8000
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  netbuis_pg:
  netbuis_media:
  netbuis_private:
